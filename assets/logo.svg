<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="otel-kit logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="traces" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <linearGradient id="logs" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="metrics" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <!-- Three signals fanning out from one source: traces / logs / metrics -->
  <g fill="none" stroke-linecap="round" stroke-width="11">
    <path d="M42 42 A48 48 0 0 1 90 90" stroke="url(#traces)"/>
    <path d="M42 58 A32 32 0 0 1 74 90" stroke="url(#logs)"/>
    <path d="M42 74 A16 16 0 0 1 58 90" stroke="url(#metrics)"/>
  </g>
  <!-- Source node -->
  <circle cx="42" cy="90" r="11" fill="#0b1020"/>
  <circle cx="42" cy="90" r="7.5" fill="#f8fafc"/>
</svg>
